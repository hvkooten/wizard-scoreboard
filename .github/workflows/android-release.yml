name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to (re)release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is empty."
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a valid SemVer tag (vmajor.minor.patch)."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet and MAUI workload cache
        id: cache-maui
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/workloadmetadata
          key: ${{ runner.os }}-dotnet10-maui-${{ hashFiles('**/*.csproj', '**/global.json', '.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-maui-

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Validate tag version is higher than source version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }

          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a valid SemVer (major.minor.patch)."
          }

          $proj = "src/scoreboard/WizardScoreboard.csproj"
          [xml]$xml = Get-Content $proj
          $currentDisplayVersion = $xml.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($currentDisplayVersion)) {
            throw "ApplicationDisplayVersion not found in $proj"
          }

          $tagVersion = [version]$tag
          $currentVersion = [version]$currentDisplayVersion

          if ("${{ github.event_name }}" -eq "push" -and $tagVersion -le $currentVersion) {
            throw "Tag version $tagVersion must be higher than current source version $currentVersion"
          }

          $parts = $tag.Split('.')
          $versionCode = ([int]$parts[0] * 10000) + ([int]$parts[1] * 100) + [int]$parts[2]

          "display_version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version_code=$versionCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore app
        run: dotnet restore src/scoreboard/WizardScoreboard.csproj

      - name: Publish Android APK
        shell: pwsh
        run: |
          dotnet publish src/scoreboard/WizardScoreboard.csproj `
            -f net10.0-android `
            -c Release `
            -p:AndroidPackageFormats=apk `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.display_version }} `
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} `
            --no-restore

      - name: Collect APK artifact
        id: artifact
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/scoreboard/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1
          if (-not $apk) {
            throw "APK output not found."
          }

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $versioned = "artifacts/wizard-scoreboard-android-v${{ steps.version.outputs.display_version }}.apk"
          $latest = "artifacts/wizard-scoreboard-android.apk"
          Copy-Item $apk.FullName $versioned -Force
          Copy-Item $apk.FullName $latest -Force

      - name: Delete existing release for manual rerun
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Wizard Scoreboard ${{ steps.release_tag.outputs.tag }}
          overwrite_files: true
          files: |
            artifacts/wizard-scoreboard-android-v${{ steps.version.outputs.display_version }}.apk
            artifacts/wizard-scoreboard-android.apk

      - name: Save NuGet and MAUI workload cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/workloadmetadata
          key: ${{ steps.cache-maui.outputs.cache-primary-key }}

  update-version-page:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-android-release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update version source and overview page
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%d)"
          VERSION_CODE=$(echo "$TAG" | awk -F. '{ print ($1*10000)+($2*100)+$3 }')

          # Update source version so repository reflects released Android version.
          sed -i -E "s#<ApplicationDisplayVersion>[^<]+</ApplicationDisplayVersion>#<ApplicationDisplayVersion>${TAG}</ApplicationDisplayVersion>#" src/scoreboard/WizardScoreboard.csproj
          sed -i -E "s#<ApplicationVersion>[^<]+</ApplicationVersion>#<ApplicationVersion>${VERSION_CODE}</ApplicationVersion>#" src/scoreboard/WizardScoreboard.csproj

          ENTRY="- [v${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${TAG}) - [Download APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${TAG}/wizard-scoreboard-android.apk) (${DATE})"

          if ! grep -Fq "releases/tag/v${TAG}" VERSION_OVERVIEW.md; then
            TMP_FILE="$(mktemp)"
            {
              head -n 5 VERSION_OVERVIEW.md
              echo "$ENTRY"
              tail -n +6 VERSION_OVERVIEW.md
            } > "$TMP_FILE"
            mv "$TMP_FILE" VERSION_OVERVIEW.md
          fi

      - name: Commit and push updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/scoreboard/WizardScoreboard.csproj VERSION_OVERVIEW.md
          git commit -m "docs: add release v${GITHUB_REF_NAME#v} to version overview"
          git push

name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to (re)release, e.g. v2.0.0  or leave empty to use latest existing v*.*.* tag"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"

            # If input is empty, resolve to latest semantic version tag from origin.
            if ([string]::IsNullOrWhiteSpace($tag)) {
              $tagRefs = git ls-remote --tags --refs origin "v*.*.*"
              $semverTags = @()

              foreach ($line in $tagRefs) {
                if ($line -match "refs/tags/(v\d+\.\d+\.\d+)$") {
                  $semverTags += $Matches[1]
                }
              }

              if ($semverTags.Count -eq 0) {
                throw "No matching tags found in origin (expected vmajor.minor.patch)."
              }

              $tag = $semverTags |
                Sort-Object { [version]($_.TrimStart('v')) } |
                Select-Object -Last 1

              Write-Host "Using latest existing tag from origin: $tag"
            }
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is empty. Please provide release_tag input."
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a valid SemVer tag (vmajor.minor.patch)."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag '$TAG' does not exist in this repository."
            echo "::error::Please provide a valid tag, e.g., v1.0.0, v1.1.0, v2.0.0"
            echo "::error::Use 'git tag -l' to list all available tags."
            exit 1
          fi
          echo "✓ Tag $TAG verified and exists."

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet and MAUI workload cache
        id: cache-maui
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/workloadmetadata
          key: ${{ runner.os }}-dotnet10-maui-v1-${{ hashFiles('global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-maui-v1-

      - name: Install MAUI workload
        if: steps.cache-maui.outputs.cache-hit != 'true'
        run: dotnet workload install maui

      - name: Restore workloads for app
        run: dotnet workload restore src/scoreboard/WizardScoreboard.csproj -m

      - name: Validate tag version is higher than source version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }

          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a valid SemVer (major.minor.patch)."
          }

          $proj = "src/scoreboard/WizardScoreboard.csproj"
          [xml]$xml = Get-Content $proj
          $currentDisplayVersion = $xml.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($currentDisplayVersion)) {
            throw "ApplicationDisplayVersion not found in $proj"
          }

          $tagVersion = [version]$tag
          $currentVersion = [version]$currentDisplayVersion

          if ("${{ github.event_name }}" -eq "push" -and $tagVersion -le $currentVersion) {
            throw "Tag version $tagVersion must be higher than current source version $currentVersion"
          }

          $parts = $tag.Split('.')
          $versionCode = ([int]$parts[0] * 10000) + ([int]$parts[1] * 100) + [int]$parts[2]

          "display_version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version_code=$versionCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore app
        run: dotnet restore src/scoreboard/WizardScoreboard.csproj -m

      - name: Decode and prepare release keystore
        shell: pwsh
        run: |
          $keystoreBase64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          $keystorePath = "$env:RUNNER_TEMP\release.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($keystoreBase64))
          "KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Android APK
        shell: pwsh
        env:
          JAVA_OPTS: "-Xmx4g"
          _JAVA_OPTIONS: "-Xmx4g"
        run: |
          dotnet publish src/scoreboard/WizardScoreboard.csproj `
            -f net10.0-android `
            -c Release `
            -p:AndroidPackageFormats=apk `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.display_version }} `
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:KEYSTORE_PATH" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            -p:ParallelBuildCount=2 `
            -p:EmbedDebugSymbols=false `
            -p:TrimMode=partial `
            --no-restore

      - name: Collect APK artifact
        id: artifact
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/scoreboard/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1
          if (-not $apk) {
            throw "APK output not found."
          }

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $versioned = "artifacts/wizard-scoreboard-android-v${{ steps.version.outputs.display_version }}.apk"
          $latest = "artifacts/wizard-scoreboard-android.apk"
          Copy-Item $apk.FullName $versioned -Force
          Copy-Item $apk.FullName $latest -Force

      - name: Delete existing release for manual rerun
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Wizard Scoreboard ${{ steps.release_tag.outputs.tag }}
          overwrite_files: true
          files: |
            artifacts/wizard-scoreboard-android-v${{ steps.version.outputs.display_version }}.apk
            artifacts/wizard-scoreboard-android.apk

      - name: Save NuGet and MAUI workload cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/workloadmetadata
          key: ${{ steps.cache-maui.outputs.cache-primary-key }}

  update-version-page:
    runs-on: ubuntu-latest
    needs: build-android-release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}

      - name: Update version source and overview page
        shell: bash
        run: |
          set -euo pipefail

          upsert_version_overview() {
            local tag="$1"
            local date="$2"
            local entry="- [v${tag}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${tag}) - [Download APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${tag}/wizard-scoreboard-android.apk) (${date})"

            if grep -Fq "releases/tag/v${tag}" VERSION_OVERVIEW.md; then
              echo "Release v${tag} is already listed in VERSION_OVERVIEW.md"
              return
            fi

            local tmp_file
            tmp_file="$(mktemp)"
            awk -v entry="$entry" '
              BEGIN { inserted=0 }
              {
                if ($0 == "- No releases yet.") {
                  next
                }
                print
                if (!inserted && $0 == "## Released Versions") {
                  print ""
                  print entry
                  inserted=1
                }
              }
              END {
                if (!inserted) {
                  print ""
                  print "## Released Versions"
                  print ""
                  print entry
                }
              }
            ' VERSION_OVERVIEW.md > "$tmp_file"
            mv "$tmp_file" VERSION_OVERVIEW.md
          }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            DATE="$(date -u +%Y-%m-%d)"
            VERSION_CODE=$(echo "$TAG" | awk -F. '{ print ($1*10000)+($2*100)+$3 }')

            # Update source version so repository reflects released Android version.
            sed -i -E "s#<ApplicationDisplayVersion>[^<]+</ApplicationDisplayVersion>#<ApplicationDisplayVersion>${TAG}</ApplicationDisplayVersion>#" src/scoreboard/WizardScoreboard.csproj
            sed -i -E "s#<ApplicationVersion>[^<]+</ApplicationVersion>#<ApplicationVersion>${VERSION_CODE}</ApplicationVersion>#" src/scoreboard/WizardScoreboard.csproj
            sed -i -E "s#(<text id=\"splash-version\"[^>]*>)v[0-9]+\.[0-9]+\.[0-9]+(</text>)#\1v${TAG}\2#" src/scoreboard/Resources/Splash/splash.svg

            upsert_version_overview "$TAG" "$DATE"
          else
            TAG="${{ inputs.release_tag }}"
            TAG="${TAG#v}"
            DATE="$(date -u +%Y-%m-%d)"
            sed -i -E "s#(<text id=\"splash-version\"[^>]*>)v[0-9]+\.[0-9]+\.[0-9]+(</text>)#\1v${TAG}\2#" src/scoreboard/Resources/Splash/splash.svg
            upsert_version_overview "$TAG" "$DATE"
          fi

          if ! grep -Fq "releases/tag/v${TAG}" VERSION_OVERVIEW.md; then
            echo "VERSION_OVERVIEW.md did not contain expected release entry for v${TAG}."
            exit 1
          fi

      - name: Commit and push updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            COMMIT_TAG="${{ inputs.release_tag }}"
          else
            COMMIT_TAG="v${GITHUB_REF_NAME#v}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/scoreboard/WizardScoreboard.csproj src/scoreboard/Resources/Splash/splash.svg VERSION_OVERVIEW.md
          git commit -m "docs: sync release metadata for ${COMMIT_TAG}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

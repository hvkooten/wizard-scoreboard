name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore app
        run: dotnet restore src/scoreboard/WizardScoreboard.csproj

      - name: Build app
        run: dotnet build src/scoreboard/WizardScoreboard.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore

      - name: Restore tests
        run: dotnet restore src/scoreboard.Tests/WizardScoreboard.Tests.csproj

      - name: Run tests
        run: dotnet test src/scoreboard.Tests/WizardScoreboard.Tests.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore -v minimal

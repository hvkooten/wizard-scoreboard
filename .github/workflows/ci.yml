name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet and MAUI workload cache
        id: cache-maui
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/workloadmetadata
          key: ${{ runner.os }}-dotnet10-maui-${{ hashFiles('**/*.csproj', '**/global.json', '.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-maui-

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore workloads for app
        run: dotnet workload restore src/scoreboard/WizardScoreboard.csproj

      - name: Restore app
        run: dotnet restore src/scoreboard/WizardScoreboard.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64

      - name: Build app
        run: dotnet build src/scoreboard/WizardScoreboard.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --no-restore

      - name: Restore tests
        run: dotnet restore src/scoreboard.Tests/WizardScoreboard.Tests.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=false

      - name: Run tests
        run: dotnet test src/scoreboard.Tests/WizardScoreboard.Tests.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=false -v minimal

      - name: Save NuGet and MAUI workload cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/workloadmetadata
          key: ${{ steps.cache-maui.outputs.cache-primary-key }}
